<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/rg_col.svg" />
    <title>Genetic Correlation Browser · UKBB LDSC</title>
    <meta
      name="description"
      content="Interactive browser of UK Biobank LDSC genetic correlations across 677 heritable phenotypes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Disable GoatCounter's automatic pageview; the app counts each hash route itself. -->
    <script>
      window.goatcounter = { no_onload: true };
    </script>
    <script
      data-goatcounter="https://n-i-k.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
